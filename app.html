<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KEXP Now Playing</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header class="text-size-sm text-style-uppercase text-spacing-md">
      <img src="images/logo-wordmark-white.svg" class="header-logo" alt="KEXP" />
      <span>Now Playing</span>
      <span class="dot pulse"></span>
      <button class="refresh refresh-indicator text-button m-l-auto" title="Refresh now" aria-label="Refresh now">
        <span class="refresh-icon" aria-hidden="true">&#8635;</span>
      </button>
      <button class="sidebar-button text-button m-l-auto" title="Open Sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" height="14" width="14" viewBox="0 -960 960 960" fill="currentColor">
          <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H360v560H200Zm160 0v-560-160 560Z"/>
        </svg>
      </button>
      <div id="loader" class="loader"></div>
    </header>
    
    <section id="error" class="error stack stack--horizontal stack--center text-size-sm text-style-uppercase text-spacing-md hidden">
      <span>Error loading playlist</span>
      <button class="refresh button button-error m-l-auto">Retry</button>
    </section>

    <main class="content-layout">
      <div class="current-column">
        <div class="current-art"></div>
        <section id="current-track" class="current-info stack surface-primary"></section>
        <section id="current-comment" class="current-comment surface-primary"></section>

        <details class="settings-section" open>
          <summary class="settings-summary section-label text-style-uppercase text-spacing-lg text-color-muted text-size-xs text-weight-black">Options</summary>
          <div class="settings-list">
            <label class="setting-row" for="theme">
              <span>Appearance</span>
              <select id="theme">
                <option value="system">System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
              </select>
            </label>

            <label class="setting-row" for="history-size">
              <span>Recent tracks</span>
              <select id="history-size">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="40">40</option>
              </select>
            </label>

            <label class="setting-row" for="show-history-comments">
              <span>Show DJ comments in history</span>
              <input id="show-history-comments" type="checkbox" role="switch">
            </label>

            <label class="setting-row" for="default-sidebar">
              <span>Default open as side panel</span>
              <input id="default-sidebar" type="checkbox" role="switch">
            </label>

          </div>
        </details>
      </div>

      <section id="history" class="history-section stack hidden">
        <h4 class="section-label text-style-uppercase text-spacing-lg text-color-muted text-size-xs text-weight-black">Recent Tracks</h4>
        <ul id="history-list" class="stack"></ul>
        <a
          id="full-playlist-link"
          href="https://kexp.org/playlist/"
          target="_blank"
          rel="noopener noreferrer"
          class="button button-secondary"
        >
          View Full Playlist &nearr;
        </a>
      </section>

    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
