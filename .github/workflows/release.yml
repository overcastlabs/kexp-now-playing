name: Release extension
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    name: Validate, package, and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and manifest version
        id: release
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v1.2.3; received: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"

          if [[ "$manifest_version" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version" >&2
            exit 1
          fi

          git fetch origin main --no-tags
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release tag must point to a commit on main" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Package extension
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: scripts/package-extension.sh "dist/kexp-now-playing-${VERSION}.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          package="dist/kexp-now-playing-${VERSION}.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$package" --clobber
          else
            gh release create "$TAG" "$package" \
              --verify-tag \
              --title "KEXP Now Playing ${TAG}" \
              --generate-notes
          fi

  chrome-web-store:
    name: Publish to Chrome Web Store
    needs: github-release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-chrome.yml
    with:
      tag: ${{ needs.github-release.outputs.tag }}
