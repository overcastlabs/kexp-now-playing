name: Publish to Chrome Web Store
run-name: Publish ${{ inputs.tag }}

on:
  workflow_call:
    inputs:
      tag:
        description: Existing GitHub Release tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to publish, such as v1.2.3
        required: true
        type: string

concurrency:
  group: chrome-web-store-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Upload and submit
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3; received: $TAG" >&2
            exit 1
          fi

          for name in CWS_PUBLISHER_ID CWS_EXTENSION_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing chrome-web-store environment variable: $name" >&2
              exit 1
            fi
          done

      - name: Download release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          package="dist/kexp-now-playing-${version}.zip"
          mkdir -p dist
          gh release download "$TAG" --pattern "$(basename "$package")" --dir dist

          package_version="$(unzip -p "$package" manifest.json | node -e 'let data=""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(data).version));')"
          if [[ "$package_version" != "$version" ]]; then
            echo "Release package version $package_version does not match tag $TAG" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload and submit for publishing
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          version="${TAG#v}"
          EXPECTED_VERSION="$version" node scripts/publish-chrome-web-store.mjs "dist/kexp-now-playing-${version}.zip"
